name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "searchSNP") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            echo "Bump the version in Cargo.toml (and Cargo.lock), or tag as v${version}." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds run on any Linux distribution, old or new.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            smoke: true
          # Intel build is cross-compiled on an Apple Silicon runner.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            smoke: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: ./target/${{ matrix.target }}/release/searchSNP --version
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/searchSNP-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" searchSNP
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "searchSNP-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/searchSNP.exe" "dist/"
          Compress-Archive -Path "dist/searchSNP.exe" -DestinationPath "dist/$name.zip"
          Remove-Item "dist/searchSNP.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "searchSNP ${GITHUB_REF_NAME}" \
            --generate-notes
