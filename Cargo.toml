[package]
name = "searchSNP"
version = "0.2.0"
edition = "2021"
description = "Check whether called SNPs/indels are supported by exact k-mer matches in raw reads"

[[bin]]
name = "searchSNP"
path = "src/main.rs"

[lib]
name = "search_snp"
path = "src/lib.rs"

[dependencies]
# gzip decompression of FASTQ files (zlib-rs: pure-Rust, fast, no C toolchain)
flate2 = { version = "1", features = ["zlib-rs"] }
# command line parsing (--help, validation of values)
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
