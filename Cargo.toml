[package]
name = "searchSNP"
version = "0.1.0"
edition = "2021"
description = "Check whether called SNPs/indels are supported by exact k-mer matches in raw reads"

[[bin]]
name = "searchSNP"
path = "src/main.rs"

[lib]
name = "search_snp"
path = "src/lib.rs"

[dependencies]
# gzip decompression of FASTQ files
flate2 = "1"
# command line parsing (--help, validation of values)
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
